name: apply

on:
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repo (owner/name). Leave blank to apply all manifests.'
        required: false
        type: string
      prune:
        description: 'Allow deletion of remote rulesets'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Verify secret is present
        env:
          GH_TOKEN: ${{ secrets.GH_RULES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_RULES_TOKEN secret is empty or missing"
            exit 1
          fi
          echo "GH_RULES_TOKEN is set (length: ${#GH_TOKEN})"
      - name: Apply
        env:
          GH_TOKEN: ${{ secrets.GH_RULES_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.repo }}" ]; then
            ARGS="--repo ${{ inputs.repo }}"
          fi
          if [ "${{ inputs.prune }}" = "true" ]; then
            ARGS="$ARGS --prune"
          fi
          npm run apply -- $ARGS

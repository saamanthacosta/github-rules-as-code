name: apply

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Apply
        env:
          GH_TOKEN: ${{ secrets.GH_RULES_TOKEN }}
        run: npm run apply

name: plan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo (owner/name). Leave blank to plan all manifests."
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Compute plan
        env:
          GH_TOKEN: ${{ secrets.GH_RULES_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.repo }}" ]; then
            ARGS="--repo ${{ inputs.repo }}"
          fi
          npm run plan -- $ARGS

name: plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Compute plan
        env:
          GH_TOKEN: ${{ secrets.GH_RULES_TOKEN }}
        run: npm run plan
